services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cabs_test
      POSTGRES_PASSWORD: cabs_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cabs_test']
      interval: 2s
      timeout: 5s
      retries: 15
